<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Hold On</title>
		<style>
			:root { font-family: system-ui, sans-serif; color: #1f2328; background: #f7f7f9; }
			body { margin: 0; padding: 28px 18px; }
			main { max-width: 860px; margin: auto; padding: 24px; background: white; border: 1px solid #d0d7de; border-radius: 12px; }
			fieldset { margin: 16px 0; padding: 14px; border: 1px solid #d0d7de; border-radius: 8px; }
			label { display: block; margin: 8px 0; font-weight: 600; }
			input, select, button { box-sizing: border-box; font: inherit; }
			input, select { width: 100%; margin-top: 4px; padding: 7px; }
			button { padding: 7px 11px; border: 1px solid #8c959f; border-radius: 6px; background: #f6f8fa; cursor: pointer; }
			.primary { border-color: #1f6feb; background: #1f6feb; color: white; }
			.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
			.editable-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 7px 0; }
			.query-row { grid-template-columns: 1fr 1fr auto; }
			.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
			#navigate-link { overflow-wrap: anywhere; }
			#status { padding: 10px; background: #f6f8fa; overflow-wrap: anywhere; }
		</style>
	</head>
	<body>
		<main>
			<h1>Page held before loading</h1>
			<p>Edit the destination, move or recreate this tab in the container you want, then navigate when ready.</p>
			<form>
				<fieldset><legend>Address</legend><div class="grid">
					<label>Scheme<select id="scheme"><option value="http">HTTP</option><option value="https">HTTPS</option></select></label>
					<label>Hostname<input id="hostname" autocomplete="off" /></label>
					<label>Port<input id="port" inputmode="numeric" autocomplete="off" /></label>
					<label>Username<input id="username" autocomplete="off" /></label>
					<label>Password<input id="password" type="password" autocomplete="off" /></label>
				</div></fieldset>
				<fieldset><legend>Path</legend><div id="path-rows"></div><button id="add-path" type="button">Add path element</button></fieldset>
				<fieldset><legend>Query parameters</legend><div id="query-rows"></div><button id="add-query" type="button">Add query parameter</button></fieldset>
				<fieldset><legend>Fragment</legend><input id="fragment" autocomplete="off" /></fieldset>
				<p id="status" aria-live="polite"></p>
				<div class="actions"><button class="primary" type="submit">Navigate</button><a id="navigate-link" target="_self">Navigate using this link</a></div>
			</form>
		</main>
		<script src="interstitial.js"></script>
	</body>
</html>
